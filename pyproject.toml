[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdr-agent"
version = "0.1.0"
description = "SDR Agent com LangGraph, FastAPI e Supabase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.3",
    
    # LangChain / LangGraph
    "langgraph>=1.1.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-core>=0.3.0",
    "langgraph-sdk>=0.3.0",
    "langsmith>=0.7.0",
    
    # Observabilidade
    "langfuse>=4.0.0",
    
    # Banco de Dados
    "supabase>=2.3.0",
    "httpx>=0.26.0",
    
    # Validação e Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Utilitários
    "python-dotenv>=1.0.0",
    
    # Testes
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
prod = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
